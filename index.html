<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veronika Mochalova</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 600px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    p {
      font-size: 1.125rem;
      opacity: 0.9;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .links {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    a {
      color: #fff;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 8px;
      transition: background 0.2s, border-color 0.2s;
    }

    a:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Veronika Mochalova</h1>
    <p>Welcome to my GitHub Pages site.</p>
    <div class="links">
      <a href="https://github.com/veronikamochalova" target="_blank" rel="noopener noreferrer">GitHub</a>
    </div>
  </div>
</body>
</html>
